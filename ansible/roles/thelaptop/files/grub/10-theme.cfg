# Keep the bootloader theme on the unencrypted EFI filesystem so GRUB can read it.
GRUB_THEME="/boot/grub/themes/catppuccin-frappe-grub-theme/theme.txt"
GRUB_GFXMODE="1920x1080,auto"
GRUB_GFXPAYLOAD_LINUX=keep

# Preserve arguments from /etc/default/grub while enabling Plymouth.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} splash systemd.show_status=auto rd.udev.log_level=3"
