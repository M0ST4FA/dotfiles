---
- name: Stow all user configuration
  tags: stow
  ansible.builtin.command:
    cmd: "stow --no-folding -v -d /home/{{ user }}/dotfiles/stow -t /home/{{ user }} {{ item }}"
  loop:
    - zsh

    - nvim

    - git
    - clang
    - clangd
    - gdb

    - hyprland
    - hyprpanel
    - niri
    - noctalia
    - fontconfig
    - anyrun

    - kitty
    - wezterm
    - foot
    - fastfetch
    - btop

    - services
    - taskwarrior
    - taskwarrior-tui
    - timewarrior

    - wireshark

    - kvantum
    - qt6ct
    - mpd
    - mpv
    - neomutt
    - nwg-look
    - openrazer
    - polychromatic
    - satty
    - waypaper
    - yazi
    - zathura
    - pavucontrol
    - mame
    - mimeapps
    - desktop-portal
    - termfilechooser
    - qalculate
    - pet
    - jrnl
    - godot
    - flow-state
    - codex
    - antigravity
    - ghcup
  register: stow_res
  failed_when: stow_res.rc != 0
  changed_when:
    - stow_res.rc == 0
    - "'LINK' in stow_res.stderr"
  become: true
  become_user: "{{ user }}"

- name: Restore locked Yazi plugins and flavors
  tags: stow
  ansible.builtin.command:
    cmd: ya pkg install
  environment:
    GIT_CONFIG_GLOBAL: /dev/null
  changed_when: false
  become: true
  become_user: "{{ user }}"

- name: Install pinned Flow State CLI
  tags: stow
  ansible.builtin.command:
    cmd: cargo install flow_state --version 1.0.6 --locked
    creates: "/home/{{ user }}/.cargo/bin/flow_state"
  become: true
  become_user: "{{ user }}"
