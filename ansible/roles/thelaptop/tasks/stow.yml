- name: Stow all user configuration
  tags: stow
  ansible.builtin.command:
    cmd: "stow -v -d ~/dotfiles/stow -t ~ {{ item }}"
  loop:
    - zsh

    - nvim

    - git
    - clang
    - clangd
    - gdb

    - hyprland
    - hyprpanel
    - niri
    - noctalia
    - anyrun

    - kitty
    - wezterm
    - foot
    - fastfetch
    - btop

    - wireshark

    - kvantum
    - mpd
    - mpv
    - neomutt
    - nwg-look
    - openrazer
    - polychromatic
    - satty
    - waypaper
    - yazi
    - zathura
    - pavucontrol
    - mame
  register: stow_res
  failed_when: stow_res.rc != 0
  changed_when:
    - stow_res.rc == 0
    - "'LINK' in stow_res.stderr"
  become: true
  become_user: "{{ user }}"

- name: Restore locked Yazi plugins and flavors
  tags: stow
  ansible.builtin.command:
    cmd: ya pkg install
  environment:
    GIT_CONFIG_GLOBAL: /dev/null
  changed_when: false
  become: true
  become_user: "{{ user }}"
