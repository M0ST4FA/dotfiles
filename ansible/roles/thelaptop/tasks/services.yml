- name: Enable services
  tags: services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - nord-console.service
    - greetd.service

    - kmsconvt@tty2.service
    - kmsconvt@tty3.service
    - kmsconvt@tty4.service
    - kmsconvt@tty5.service
    - getty@tty6.service

    - NetworkManager.service
    - systemd-resolved.service
    - bluetooth.service
    - chronyd.service

    - supergfxd.service
    - switcheroo-control.service
    - tlp.service

    - docker.socket
    - libvirtd.socket

    - fstrim.timer
    - reflector.timer
  become: true

- name: Let NetworkManager manage iwd
  tags: services
  ansible.builtin.systemd_service:
    name: iwd.service
    enabled: false
  become: true

- name: Create user systemd enablement directories
  tags: services
  ansible.builtin.file:
    path: "/home/{{ user }}/.config/systemd/user/{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0755"
  loop:
    - graphical-session.target.wants
    - sockets.target.wants
  become: true

- name: Enable user services and sockets
  tags: services
  ansible.builtin.file:
    src: "/usr/lib/systemd/user/{{ item.unit }}"
    dest: "/home/{{ user }}/.config/systemd/user/{{ item.target }}.wants/{{ item.unit }}"
    state: link
    owner: "{{ user }}"
    group: "{{ user }}"
  loop:
    - unit: mpd.socket
      target: sockets.target
    - unit: ssh-agent.socket
      target: sockets.target
    - unit: hyprsunset.service
      target: graphical-session.target
  become: true

- name: Disable user services replaced by Noctalia
  tags: services
  ansible.builtin.file:
    path: "/home/{{ user }}/.config/systemd/user/graphical-session.target.wants/{{ item }}"
    state: absent
  loop:
    - hypridle.service
    - hyprpolkitagent.service
  become: true
