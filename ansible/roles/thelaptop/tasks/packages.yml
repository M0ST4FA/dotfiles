- name: Trust the Pharo repository signing key
  tags: packages
  community.general.pacman_key:
    id: 536316AFF4E2E8B89ECD38E5CD55515EEBDB2B90
    url: https://download.opensuse.org/repositories/devel:/languages:/pharo:/stable/Arch/x86_64/devel_languages_pharo_stable_Arch.key
    state: present
    ensure_trusted: true

- name: Update pacman cache and upgrade
  tags: packages,upgrade
  community.general.pacman:
    update_cache: yes
    upgrade: yes

- name: Check if paru is installed
  tags: packages
  ansible.builtin.command: pacman -Qs paru
  register: paru_check
  failed_when: false
  changed_when: false

- name: Clone paru repo
  tags: packages
  ansible.builtin.git:
    repo: https://aur.archlinux.org/paru.git
    dest: /tmp/paru
  when: paru_check.rc != 0

- name: Change ownership of paru build directory
  tags: packages
  ansible.builtin.file:
    path: /tmp/paru
    state: directory
    owner: m0st4fa
    group: m0st4fa
    recurse: yes
  when: paru_check.rc != 0

- name: Build and install paru
  tags: packages
  ansible.builtin.command:
    cmd: makepkg -si --noconfirm
    chdir: /tmp/paru
  become: true
  become_user: "{{ user }}"
  when: paru_check.rc != 0

- name: Include variables referencing packages
  tags: packages
  ansible.builtin.include_vars:
    dir: packages

- name: Assemble the primary package catalog
  tags: packages
  ansible.builtin.set_fact:
    workstation_primary_packages: "{{ query('ansible.builtin.vars', *package_groups) | flatten }}"

- name: Ensure every primary package belongs to exactly one category
  tags: packages
  ansible.builtin.assert:
    that:
      - workstation_primary_packages | unique | length == workstation_primary_packages | length
    fail_msg: A package is listed in more than one vars/packages category.

- name: Discover package feature-set tables
  tags: packages
  ansible.builtin.set_fact:
    workstation_feature_set_tables: >-
      {{
        vars
        | dict2items
        | selectattr('key', 'match', '^package_feature_sets_')
        | list
      }}

- name: Ensure package feature-set variables are tables
  tags: packages
  ansible.builtin.assert:
    that:
      - item.value is mapping
    fail_msg: "{{ item.key }} must be a table of feature-set arrays."
  loop: "{{ workstation_feature_set_tables }}"

- name: Ensure package feature sets are tables of arrays
  tags: packages
  ansible.builtin.assert:
    that:
      - item.value is sequence
      - item.value is not string
    fail_msg: >-
      Each package_feature_sets_* entry must map a feature-set name to an array
      of package names.
  loop: "{{ workstation_feature_set_tables | map(attribute='value') | map('dict2items') | flatten }}"

- name: Assemble package feature-set packages
  tags: packages
  ansible.builtin.set_fact:
    workstation_feature_packages: >-
      {{
        workstation_feature_set_tables
        | map(attribute='value')
        | map('dict2items')
        | flatten
        | map(attribute='value')
        | flatten
      }}

- name: Combine primary packages and feature-set packages
  tags: packages
  ansible.builtin.set_fact:
    workstation_packages: "{{ (workstation_primary_packages + workstation_feature_packages) | unique }}"

- name: Install all official and AUR packages
  tags: packages
  kewlfft.aur.aur:
    use: "{{ aur_helper }}"
    name: "{{ workstation_packages }}"
    state: present
    extra_args: --skipreview
  become: true
  become_user: "{{ user }}"
