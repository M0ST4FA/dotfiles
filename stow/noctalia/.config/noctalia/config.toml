[bar.default]
border_width = 1.5
capsule = true
capsule_thickness = 0.72999998740851879
center = [ "workspaces", "cat" ]
concave_edge_corners = false
end = [ "group:g1", "group:g2", "group:g3" ]
icon_color = "primary"
margin_edge = 5
margin_opposite_edge = 2
start = [ "control-center", "clock", "media" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "tray", "notifications", "volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 608.0
    box_width = 640.0
    cx = 768.0
    cy = 432.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        visualization_mode = "all"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 288.0
    box_width = 272.0
    cx = 160.0
    cy = 208.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = -0.0
    type = "calendar"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        show_events = false
        show_week_numbers = false

[dock]
smart_auto_hide = true

[hot_corners]
delay_ms = 300

    [hot_corners.top_left]
    action = "window_switcher"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 2700.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 682.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1121.5
    cy = 493.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "yocraft/battery-widget:widget"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = true
        background_color = "surface"
        background_opacity = 0.80000000000000004
        background_padding = 10
        background_radius = 12
        battery = "auto"
        battery_name = "BAT0"
        charging_color = "on_surface"
        color = "on_surface"
        hide_full = false
        hide_plugged = false
        label_content = "percent"
        layout = "horizontal"
        show_glyph = true
        show_label = true
        warning_color = "error"

[nightlight]
enabled = true

[notification]
history_retention_hours = 6
layer = "overlay"

[plugin_settings."noctalia/bitwarden"]
serve_port = 7625

[plugins]
enabled = [ "noctalia/bitwarden", "liamwh/emoji-picker", "oldirtty/color_picker", "dotnetrob/cat", "yocraft/battery-widget" ]

[shell]
clipboard_auto_paste = "off"
font_family = "RecMonoCasual Nerd Font"
password_style = "random"
screen_time_enabled = true
telemetry_enabled = true

    [shell.launcher.providers.emoji]
    global = true

        [shell.launcher.providers.panels]
    global = true

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

[theme]
builtin = "Nord"
community_palette = "Oxocarbon"
mode = "dark"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "qt" ]

[wallpaper]
directory = "/usr/share/wallpapers/Favorites/"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 600
    recursive = false

    [wallpaper.default]
    path = "/usr/share/wallpapers/Favorites/ign-0008.png"

    [wallpaper.monitors.eDP-1]
    path = "/usr/share/wallpapers/Favorites/ign-0008.png"

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.clock]
format = "{:%b %d, %I:%M %p}"

[widget.control-center]
glyph = "navigation-filled"

[widget.media]
hide_when_no_media = true

[widget.workspaces]
anchor = true
capsule = true
capsule_border = "primary"
scale = 1.25
style = "focus_hint"
