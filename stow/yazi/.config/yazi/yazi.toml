[plugin]
prepend_preloaders = [
  # Combined audio, video, image, subrip, and postscript/illustrator types
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/{subrip,postscript,illustrator,dvb.ait,vnd.adobe.illustrator}", run = "mediainfo" },
  { mime = "image/x-eps", run = "mediainfo" },
  { mime = "application/eps", run = "mediainfo" },

  # Handle AI/EPS file extension fallback
  { url = "*.{ai,eps,ait}", run = "mediainfo" }
]

prepend_previewers = [
  # Combined identical mime definitions to save space
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/{subrip,postscript,illustrator,dvb.ait,vnd.adobe.illustrator}", run = "mediainfo" },
  { mime = "image/x-eps", run = "mediainfo" },
  { mime = "application/eps", run = "mediainfo" },

  # Extension fallbacks
  { url = "*.{ai,eps,ait}", run = "mediainfo" },

  # Text/Rich previews combined into a single glob pattern
  { url = "*.{csv,md,rst,ipynb,json}", run = "rich-preview" }
]

[[plugin.prepend_fetchers]]
url  = "*"
run  = "git"
group = "git"

[[plugin.prepend_fetchers]]
url  = "*/"
run  = "git"
group = "git"

[tasks]
image_alloc      = 1073741824        # = 1024*1024*1024 = 1024MB

[opener]
open = [
  { run = 'xdg-open %s1', desc = "Open", orphan = true, for = "linux" },
]
