<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Avoid selecting the calligraphic Urdu face as the Arabic fallback. -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Noto Nastaliq Urdu</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
