[general]
fullscreen = true
floating-hack = true
early-exit = false

initial-tool = "brush"

copy-command = "wl-copy"
save-after-copy = false

disable-notifications = false

[font]
family = "JetBrainsMono Nerd Font"

[color-palette]
# Nord colours for annotations.  Keys 1–9 select these in order.
palette = [
  "#88C0D0ff", # frost cyan
  "#81A1C1ff", # frost blue
  "#5E81ACff", # frost deep blue
  "#A3BE8Cff", # green
  "#EBCB8Bff", # yellow
  "#D08770ff", # orange
  "#BF616Aff", # red
  "#B48EADff", # purple
  "#ECEFF4ff", # snow
]

# Keep Nord colours readily available in Satty's colour picker too.
custom = [
  "#88C0D0",
  "#81A1C1",
  "#5E81AC",
  "#A3BE8C",
  "#EBCB8B",
  "#D08770",
  "#BF616A",
  "#B48EAD",
]
